<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CR & Enhancement Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#0b1120;
    --bg-grad:#142138;
    --panel:#131c30;
    --panel-2:#182338;
    --border:#243354;
    --border-soft:#1c2842;
    --text:#e9edf7;
    --text-dim:#9aa5bd;
    --text-faint:#6b7690;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --sans:'Inter', system-ui, sans-serif;

    --c-open:#f87171;
    --c-dev:#fbbf24;
    --c-uat:#a78bfa;
    --c-pending:#60a5fa;
    --c-completed:#34d399;
    --c-delay:#f87171;

    --btn-primary-1:#1e3a5f;
    --btn-primary-2:#152a4a;
    --btn-primary-text:#dbe8ff;
    --btn-primary-border:#2b4570;
    --hover-border:#37456b;
    --hover-border-strong:#3d5a8a;
    --pipeline-off:#232f4a;
    --scrollbar-thumb:#25324f;
  }
  html[data-theme="light"]{
    --bg:#f3f5fa;
    --bg-grad:#e7ecf7;
    --panel:#ffffff;
    --panel-2:#f2f5fb;
    --border:#d7deec;
    --border-soft:#e5eaf3;
    --text:#1a2436;
    --text-dim:#5c6a86;
    --text-faint:#8992a8;

    --c-open:#dc4646;
    --c-dev:#b8860a;
    --c-uat:#7c5fd6;
    --c-pending:#2f6fd6;
    --c-completed:#0f9d69;
    --c-delay:#dc4646;

    --btn-primary-1:#dbe8ff;
    --btn-primary-2:#c3d9fb;
    --btn-primary-text:#1c3a63;
    --btn-primary-border:#a9c6ee;
    --hover-border:#b9c6df;
    --hover-border-strong:#93a9cc;
    --pipeline-off:#e2e7f2;
    --scrollbar-thumb:#c7d0e2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(1200px 800px at 15% -10%, var(--bg-grad) 0%, var(--bg) 55%), var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    transition:background .2s, color .2s;
  }
  #app{max-width:1180px;margin:0 auto;padding:20px 20px 60px;}

  /* ---------- Header / Nav ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;flex-wrap:wrap;
    padding-bottom:16px;margin-bottom:18px;
    border-bottom:1px solid var(--border-soft);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:38px;height:38px;border-radius:10px;
    background:linear-gradient(135deg,var(--panel-2),var(--bg));
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-weight:700;font-size:13px;color:var(--c-pending);
    flex-shrink:0;
  }
  .brand-title{font-weight:800;font-size:16.5px;letter-spacing:-0.01em;}
  .brand-sub{font-size:11.5px;color:var(--text-faint);font-family:var(--mono);margin-top:1px;}

  .nav{display:flex;gap:6px;background:var(--panel);border:1px solid var(--border-soft);padding:4px;border-radius:11px;}
  .nav button{
    appearance:none;border:none;background:transparent;color:var(--text-dim);
    font-family:var(--sans);font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px;
    cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .nav button:hover{color:var(--text);}
  .nav button.active{background:var(--panel-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border);}

  .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    appearance:none;cursor:pointer;font-family:var(--sans);font-weight:600;font-size:12.5px;
    padding:9px 13px;border-radius:9px;border:1px solid var(--border);
    background:var(--panel);color:var(--text-dim);transition:.15s;
  }
  .btn:hover{color:var(--text);border-color:var(--hover-border);background:var(--panel-2);}
  .btn.primary{background:linear-gradient(135deg,var(--btn-primary-1),var(--btn-primary-2));color:var(--btn-primary-text);border-color:var(--btn-primary-border);}
  .btn.primary:hover{border-color:var(--hover-border-strong);}
  .btn svg{width:14px;height:14px;flex-shrink:0;}
  .btn.icon-btn{padding:9px;}
  .btn.icon-btn svg{width:16px;height:16px;}
  #fileInput{display:none;}

  /* ---------- Page title ---------- */
  .page-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .page-head h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-0.01em;}
  .page-head .hint{font-size:12px;color:var(--text-faint);}

  /* ---------- Stat cards ---------- */
  .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:18px;}
  @media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr);}}
  .stat{
    background:var(--panel);border:1px solid var(--border-soft);border-left:3px solid var(--accent, #445);
    border-radius:10px;padding:12px 13px;
  }
  .stat .num{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1;color:var(--text);}
  .stat .label{font-size:11px;color:var(--text-dim);margin-top:6px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}

  /* ---------- Skop/Fokus chip filter ---------- */
  .scope-chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px;}
  .scope-chip{
    appearance:none;cursor:pointer;font-family:var(--sans);font-weight:600;font-size:12px;
    display:inline-flex;align-items:center;gap:7px;
    padding:7px 12px;border-radius:99px;border:1px solid var(--border-soft);
    background:var(--panel);color:var(--text-dim);transition:.15s;
  }
  .scope-chip:hover{color:var(--text);border-color:var(--hover-border);}
  .scope-chip.active{
    background:linear-gradient(135deg,var(--btn-primary-1),var(--btn-primary-2));
    color:var(--btn-primary-text);border-color:var(--btn-primary-border);
  }
  .scope-chip .chip-count{
    font-family:var(--mono);font-size:10.5px;font-weight:700;
    background:rgba(255,255,255,.1);padding:1px 6px;border-radius:99px;
  }
  .scope-chip.active .chip-count{background:rgba(255,255,255,.18);}

  /* ---------- Pipeline bar ---------- */
  .pipeline{display:flex;align-items:center;gap:3px;width:132px;flex-shrink:0;}
  .pipeline .seg{height:5px;flex:1;border-radius:3px;background:var(--pipeline-off);}
  .pipeline .seg.on{background:var(--seg-color,#556);}
  .pipeline-labels{display:none;}

  /* ---------- CR list ---------- */
  .panel{background:var(--panel);border:1px solid var(--border-soft);border-radius:13px;overflow:hidden;}
  .list-head{
    display:grid;grid-template-columns:100px minmax(0,1fr) 128px 92px 100px 100px 20px;gap:14px;
    padding:10px 16px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--text-faint);border-bottom:1px solid var(--border-soft);
  }
  @media(max-width:760px){.list-head{display:none;}}
  .cr-row{
    display:grid;grid-template-columns:100px minmax(0,1fr) 128px 92px 100px 100px 20px;gap:14px;align-items:center;
    padding:11px 16px;border-bottom:1px solid var(--border-soft);cursor:pointer;transition:background .12s;
  }
  .cr-row:last-child{border-bottom:none;}
  .cr-row:hover{background:var(--panel-2);}
  @media(max-width:760px){
    .cr-row{grid-template-columns:1fr;gap:6px;padding:13px 16px;}
  }
  .cr-id{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--c-pending);}
  .cr-title-wrap{min-width:0;}
  .cr-title{font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .cr-scope{font-size:11px;color:var(--text-faint);display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .pill{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
    padding:4px 9px;border-radius:99px;width:fit-content;white-space:nowrap;
  }
  .pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .cr-date{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);white-space:nowrap;}
  .chev{color:var(--text-faint);font-size:14px;}

  /* ---------- Trend strip ---------- */
  .trend{display:flex;align-items:flex-end;gap:10px;height:64px;margin-top:2px;}
  .trend .bar-col{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;height:100%;justify-content:flex-end;}
  .trend .bar{width:100%;max-width:34px;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,#3ee6a8,#1f9e73);min-height:3px;}
  .trend .m-label{font-size:10.5px;color:var(--text-faint);font-family:var(--mono);}
  .trend .m-val{font-size:10.5px;color:var(--text-dim);font-family:var(--mono);}

  .section-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin:22px 0 10px;}

  /* ---------- Task / Deployment cards ---------- */
  .task-card{border-bottom:1px solid var(--border-soft);padding:14px 16px;}
  .task-card:last-child{border-bottom:none;}
  .task-top{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .task-num{
    font-family:var(--mono);font-size:11.5px;color:var(--text-faint);
    width:22px;height:22px;border-radius:6px;background:var(--panel-2);border:1px solid var(--border-soft);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .task-name{font-size:13.5px;font-weight:600;flex:1;}
  .task-date{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);white-space:nowrap;}
  .task-chev{color:var(--text-faint);transition:transform .15s;}
  .task-body{display:none;padding:12px 0 2px 32px;font-size:12.5px;color:var(--text-dim);line-height:1.55;}
  .task-body .field-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:700;margin-bottom:3px;margin-top:10px;}
  .task-body .field-label:first-child{margin-top:0;}
  .task-body .field-val{white-space:pre-wrap;color:var(--text);}
  .task-card.open .task-body{display:block;}
  .task-card.open .task-chev{transform:rotate(90deg);}

  /* ---------- Deployment table ---------- */
  .dep-table{width:100%;border-collapse:collapse;}
  .dep-table th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);
    padding:10px 16px;border-bottom:1px solid var(--border-soft);font-weight:700;
  }
  .dep-table td{padding:13px 16px;border-bottom:1px solid var(--border-soft);font-size:13px;vertical-align:top;}
  .dep-table tr:last-child td{border-bottom:none;}
  .dep-cr{font-family:var(--mono);color:var(--c-pending);font-weight:600;cursor:pointer;}
  .dep-cr:hover{text-decoration:underline;}
  .dep-plan{color:var(--text-dim);max-width:280px;}
  .empty-cell{color:var(--text-faint);font-style:italic;}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(5,9,18,.72);backdrop-filter:blur(3px);
    display:none;align-items:flex-start;justify-content:center;z-index:100;padding:5vh 16px;overflow-y:auto;
  }
  .modal-backdrop.show{display:flex;}
  .modal{
    background:var(--panel);border:1px solid var(--border);border-radius:16px;max-width:640px;width:100%;
    padding:26px 28px 28px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.5);
  }
  .modal-close{
    position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:8px;
    background:var(--panel-2);border:1px solid var(--border-soft);color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;
  }
  .modal-close:hover{color:var(--text);}
  .modal-header{margin-bottom:14px;padding-right:36px;}
  .modal-id{font-family:var(--mono);color:var(--c-pending);font-size:13px;font-weight:700;}
  .modal-title{font-size:17px;font-weight:800;margin-top:5px;letter-spacing:-0.01em;}
  .modal-scope{font-size:12px;color:var(--text-faint);margin-top:4px;}
  .modal-badges{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px;}
  .modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin:16px 0;}
  @media(max-width:480px){.modal-grid{grid-template-columns:1fr;}}
  .mfield-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:700;margin-bottom:3px;}
  .mfield-val{font-size:13px;color:var(--text);font-family:var(--mono);}
  .modal-block{margin-top:16px;}
  .modal-block .field-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:700;margin-bottom:6px;}
  .modal-block .field-val{font-size:12.8px;color:var(--text-dim);white-space:pre-wrap;line-height:1.6;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:11px 18px;border-radius:10px;font-size:13px;font-weight:500;
    box-shadow:0 12px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s;z-index:200;
    display:flex;align-items:center;gap:8px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast .dot{width:7px;height:7px;border-radius:50%;background:var(--c-completed);flex-shrink:0;}

  .footer-note{margin-top:26px;font-size:11px;color:var(--text-faint);text-align:center;}

  /* ---------- Empty state ---------- */
  .empty-state{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:70px 24px;background:var(--panel);border:1px solid var(--border-soft);border-radius:16px;
    margin-top:10px;
  }
  .empty-state-icon{
    width:56px;height:56px;border-radius:14px;background:var(--panel-2);border:1px solid var(--border-soft);
    display:flex;align-items:center;justify-content:center;color:var(--c-pending);margin-bottom:18px;
  }
  .empty-state-icon svg{width:28px;height:28px;}
  .empty-state h2{font-size:18px;margin:0 0 8px;font-weight:800;letter-spacing:-0.01em;}
  .empty-state p{font-size:13.5px;color:var(--text-dim);max-width:420px;line-height:1.6;margin:0 0 22px;}
  .empty-state-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

  /* ---------- Pagination ---------- */
  .pagination{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    padding:12px 16px;border-top:1px solid var(--border-soft);background:var(--panel-2);
  }
  .page-range{font-size:11.5px;color:var(--text-faint);font-family:var(--mono);}
  .page-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .page-nums{display:flex;gap:4px;}
  .page-num,.page-nav{
    appearance:none;cursor:pointer;font-family:var(--sans);font-weight:600;font-size:12px;
    border:1px solid var(--border-soft);background:var(--panel);color:var(--text-dim);
    padding:6px 10px;border-radius:7px;transition:.15s;
  }
  .page-num{min-width:30px;text-align:center;padding:6px 8px;}
  .page-num.active{background:linear-gradient(135deg,var(--btn-primary-1),var(--btn-primary-2));color:var(--btn-primary-text);border-color:var(--btn-primary-border);}
  .page-nav:hover:not(:disabled),.page-num:hover:not(.active){color:var(--text);border-color:var(--hover-border);}
  .page-nav:disabled{opacity:.4;cursor:not-allowed;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">CR</div>
      <div>
        <div class="brand-title">CR &amp; Enhancement Tracker</div>
        <div class="brand-sub" id="fileStamp">No workbook loaded yet</div>
      </div>
    </div>
    <div class="nav" id="nav">
      <button data-page="overview" class="active">CR Status</button>
      <button data-page="tasks">Additional Tasks</button>
      <button data-page="deployment">CR Deployment</button>
    </div>
    <div class="actions">
      <button class="btn icon-btn" id="themeToggleBtn" title="Toggle light / dark mode">
        <svg id="themeIconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <svg id="themeIconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
      <button class="btn" id="downloadTemplateBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M12 12v6M9.5 15.5L12 18l2.5-2.5"/></svg>
        Template
      </button>
      <button class="btn" id="uploadBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
        Upload Excel
      </button>
      <input type="file" id="fileInput" accept=".xlsx,.xls">
      <button class="btn primary" id="exportImgBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        Image
      </button>
      <button class="btn primary" id="exportPdfBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/></svg>
        PDF (A4)
      </button>
    </div>
  </div>

  <div id="pageContent"></div>

  <div class="footer-note">Click any CR number to view full details &middot; Data refreshes automatically when you upload a new workbook</div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBody"></div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastMsg"></span></div>

const DEFAULT_DATA = {"crs": [], "tasks": [], "deployment": [], "crSheetName": "CR_Tracker", "taskSheetName": "Additional Tasks", "depSheetName": "CR Deployment"}

const CR_PAGE_SIZE = 8;
let STATE = {
  page: 'overview',
  crPage: 1,
  theme: 'dark',
  scopeFilters: [],
  data: JSON.parse(JSON.stringify(DEFAULT_DATA)),
  fileName: 'CR_Enhancement_Tasks_Tracking.xlsx'
};

/* ================= Status / priority styling ================= */
const STATUS_STYLE = {
  'Open':               {color:'var(--c-open)',      bg:'rgba(248,113,113,.12)'},
  'In Development':     {color:'var(--c-dev)',       bg:'rgba(251,191,36,.12)'},
  'UAT':                {color:'var(--c-uat)',       bg:'rgba(167,139,250,.12)'},
  'Testing':            {color:'var(--c-uat)',       bg:'rgba(167,139,250,.12)'},
  'Pending Deployment': {color:'var(--c-pending)',    bg:'rgba(96,165,250,.12)'},
  'Completed':          {color:'var(--c-completed)', bg:'rgba(52,211,153,.12)'}
};
const PRIORITY_COLOR = { 'High':'#f87171', 'Medium':'#fbbf24', 'Low':'#60a5fa' };
const PIPELINE_STAGES = ['Open','In Development','UAT','Pending Deployment','Completed'];

function statusStyle(s){ return STATUS_STYLE[s] || {color:'var(--text-dim)', bg:'rgba(255,255,255,.06)'}; }
function esc(str){ if(str===null||str===undefined) return ''; return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* Resolve the actual column header name present in the source data (case/whitespace-insensitive
   match against a list of likely candidates), so displayed table headers always mirror the
   exact wording used in the uploaded workbook instead of a hardcoded label. */
function resolveColumn(sampleRow, candidates){
  if(sampleRow){
    const keys = Object.keys(sampleRow);
    for(const cand of candidates){
      const hit = keys.find(k=> k.trim().toLowerCase() === cand.toLowerCase());
      if(hit) return hit;
    }
  }
  return candidates[0];
}

const CR_ID_CANDIDATES = ['Ticket ID','CR ID','CR No','CR Number'];
function crIdColumn(){
  const crs = STATE.data.crs || [];
  return resolveColumn(crs[0], CR_ID_CANDIDATES);
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d);
  if(isNaN(dt.getTime())) return String(d);
  return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}

/* ================= Pipeline mini-bar ================= */
function pipelineBar(status){
  const idx = PIPELINE_STAGES.indexOf(status);
  const activeIdx = idx === -1 ? -1 : idx;
  const color = statusStyle(status).color;
  let segs = '';
  for(let i=0;i<PIPELINE_STAGES.length;i++){
    const on = i <= activeIdx;
    segs += `<div class="seg ${on?'on':''}" style="--seg-color:${color}"></div>`;
  }
  return `<div class="pipeline" title="${esc(status)}">${segs}</div>`;
}

/* ================= Derived stats ================= */
function computeStats(crs, colStatus){
  const s = { total: crs.length, Open:0, 'In Development':0, UAT:0, Testing:0, 'Pending Deployment':0, Completed:0, Delayed:0 };
  crs.forEach(c=>{
    const st = c[colStatus||'Status'] || 'Unknown';
    if(s[st] === undefined) s[st] = 0;
    s[st]++;
  });
  return s;
}

function computeMonthlyCompleted(crs){
  const counts = {};
  crs.forEach(c=>{
    if((c['Status']||'') !== 'Completed') return;
    const d = c['Actual Completion Date'];
    if(!d) return;
    const dt = new Date(d);
    if(isNaN(dt.getTime())) return;
    const key = dt.toLocaleDateString('en-US',{month:'short', year:'2-digit'});
    counts[key] = (counts[key]||0) + 1;
  });
  const entries = Object.entries(counts);
  entries.sort((a,b)=>{
    const da = new Date('1 '+a[0].replace("'","20"));
    const db = new Date('1 '+b[0].replace("'","20"));
    return da - db;
  });
  return entries;
}

/* ================= Renderers ================= */
function renderNav(){
  document.querySelectorAll('#nav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.page === STATE.page);
  });
}

function hasAnyData(){
  const d = STATE.data || {};
  return (d.crs&&d.crs.length) || (d.tasks&&d.tasks.length) || (d.deployment&&d.deployment.length);
}

function renderEmptyState(){
  return `
    <div class="empty-state">
      <div class="empty-state-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6M9 9h1"/></svg>
      </div>
      <h2>No data loaded yet</h2>
      <p>Download the Excel template, fill in your Change Requests, Additional Tasks, and Deployments, then upload it here to populate this dashboard.</p>
      <div class="empty-state-actions">
        <button class="btn primary" id="emptyDownloadBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M12 12v6M9.5 15.5L12 18l2.5-2.5"/></svg>
          Download Template
        </button>
        <button class="btn" id="emptyUploadBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
          Upload Excel
        </button>
      </div>
    </div>
  `;
}

function renderPage(){
  renderNav();
  const root = document.getElementById('pageContent');
  if(!hasAnyData()){
    root.innerHTML = renderEmptyState();
    document.getElementById('emptyDownloadBtn').addEventListener('click', ()=> document.getElementById('downloadTemplateBtn').click());
    document.getElementById('emptyUploadBtn').addEventListener('click', ()=> document.getElementById('fileInput').click());
    return;
  }
  if(STATE.page === 'overview') root.innerHTML = renderOverview();
  else if(STATE.page === 'tasks') root.innerHTML = renderTasks();
  else root.innerHTML = renderDeployment();
  attachPageEvents();
}

function renderOverview(fullList){
  const allCrs = STATE.data.crs || [];
  const sample = allCrs[0];
  const colId = resolveColumn(sample, CR_ID_CANDIDATES);
  const colTitle = resolveColumn(sample, ['Request Title','Title']);
  const colScope = resolveColumn(sample, ['Skop/Fokus','Scope']);
  const colStatus = resolveColumn(sample, ['Status']);
  const colRequestDate = resolveColumn(sample, ['Request Date']);
  const colTargetDate = resolveColumn(sample, ['Target Completion Date','Target Completion']);
  const colActualDate = resolveColumn(sample, ['Actual Completion Date','Actual Completion']);

  const scopeValue = c => (c[colScope]||'').toString().trim();
  const categories = [...new Set(allCrs.map(scopeValue).filter(Boolean))].sort((a,b)=>a.localeCompare(b));

  // Apply the active Skop/Fokus chip filter(s), if any, to everything below the chip row.
  // Multiple chips can be selected at once (OR logic); no selection = All categories.
  // If every individual category ends up selected, treat that the same as "All" being chosen.
  STATE.scopeFilters = (STATE.scopeFilters||[]).filter(c=> categories.includes(c));
  if(categories.length && STATE.scopeFilters.length === categories.length){
    STATE.scopeFilters = [];
  }
  const activeScopes = STATE.scopeFilters;
  const crs = activeScopes.length ? allCrs.filter(c=> activeScopes.includes(scopeValue(c))) : allCrs;

  const scopeChips = ['', ...categories].map(cat=>{
    const isAll = cat === '';
    const active = isAll ? activeScopes.length === 0 : activeScopes.includes(cat);
    const count = isAll ? allCrs.length : allCrs.filter(c=> scopeValue(c) === cat).length;
    return `<button class="scope-chip ${active?'active':''}" data-scope="${esc(cat)}">${isAll ? 'All' : esc(cat)}<span class="chip-count">${count}</span></button>`;
  }).join('');

  const s = computeStats(crs, colStatus);
  const monthly = computeMonthlyCompleted(crs);
  const maxMonth = Math.max(1, ...monthly.map(m=>m[1]));

  const statCards = [
    {label:'Total CRs', val:s.total, color:'#5b6b93'},
    {label:'Completed', val:s.Completed||0, color:'var(--c-completed)'},
    {label:'In Development', val:s['In Development']||0, color:'var(--c-dev)'},
    {label:'UAT / Testing', val:(s.UAT||0)+(s.Testing||0), color:'var(--c-uat)'},
    {label:'Pending Deployment', val:s['Pending Deployment']||0, color:'var(--c-pending)'},
    {label:'Open', val:s.Open||0, color:'var(--c-open)'}
  ].map(c=>`
    <div class="stat" style="--accent:${c.color}">
      <div class="num">${c.val}</div>
      <div class="label">${c.label}</div>
    </div>`).join('');

  const totalPages = Math.max(1, Math.ceil(crs.length / CR_PAGE_SIZE));
  if(STATE.crPage > totalPages) STATE.crPage = totalPages;
  if(STATE.crPage < 1) STATE.crPage = 1;
  const pageStart = fullList ? 0 : (STATE.crPage - 1) * CR_PAGE_SIZE;
  const crsPage = fullList ? crs : crs.slice(pageStart, pageStart + CR_PAGE_SIZE);

  const rows = crsPage.map(c=>{
    const st = c[colStatus]||'Unknown';
    const ss = statusStyle(st);
    return `
    <div class="cr-row" data-id="${esc(c[colId])}">
      <div class="cr-id">${esc(c[colId])}</div>
      <div class="cr-title-wrap">
        <div class="cr-title">${esc(c[colTitle]||'Untitled')}</div>
        <span class="cr-scope">${esc(c[colScope]||'')}</span>
      </div>
      <div><span class="pill" style="color:${ss.color};background:${ss.bg}"><span class="dot"></span>${esc(st)}</span></div>
      <div class="cr-date">${c[colRequestDate] ? fmtDate(c[colRequestDate]) : '<span class="empty-cell">—</span>'}</div>
      <div class="cr-date">${c[colTargetDate] ? fmtDate(c[colTargetDate]) : '<span class="empty-cell">—</span>'}</div>
      <div class="cr-date">${c[colActualDate] ? fmtDate(c[colActualDate]) : '<span class="empty-cell">—</span>'}</div>
      <div class="chev">›</div>
    </div>`;
  }).join('');

  const trend = monthly.length ? `
    <div class="section-label">Completions by Month</div>
    <div class="panel" style="padding:16px 20px;">
      <div class="trend">
        ${monthly.map(([m,v])=>`
          <div class="bar-col">
            <div class="m-val">${v}</div>
            <div class="bar" style="height:${Math.max(6,(v/maxMonth)*100)}%"></div>
            <div class="m-label">${m}</div>
          </div>`).join('')}
      </div>
    </div>` : '';

  return `
    <div class="page-head">
      <h1>Change Request Status</h1>
      <span class="hint">${crs.length} of ${allCrs.length} CRs${activeScopes.length ? ' · ' + activeScopes.map(esc).join(', ') : ''}</span>
    </div>
    ${categories.length ? `
    <div class="section-label">Filter by Skop/Fokus</div>
    <div class="scope-chip-row">${scopeChips}</div>` : ''}
    <div class="stats">${statCards}</div>
    ${trend}
    <div class="section-label">All Change Requests${fullList ? ` (all ${crs.length} shown)` : ''}</div>
    <div class="panel">
      <div class="list-head">
        <div>${esc(colId)}</div><div>${esc(colTitle)}</div><div>${esc(colStatus)}</div><div>${esc(colRequestDate)}</div><div>${esc(colTargetDate)}</div><div>${esc(colActualDate)}</div><div></div>
      </div>
      ${rows || `<div style="padding:24px;color:var(--text-faint);">${activeScopes.length ? 'No CRs match this filter.' : 'No CR data found in the workbook.'}</div>`}
      ${(!fullList && crs.length) ? renderPagination(STATE.crPage, totalPages, pageStart, crsPage.length, crs.length) : ''}
    </div>
  `;
}

function renderPagination(current, total, pageStart, pageCount, totalCount){
  if(total <= 1) return `<div class="pagination"><span class="page-range">Showing all ${totalCount} CRs</span></div>`;
  let pageBtns = '';
  for(let i=1;i<=total;i++){
    pageBtns += `<button class="page-num ${i===current?'active':''}" data-page="${i}">${i}</button>`;
  }
  return `
    <div class="pagination">
      <span class="page-range">Showing ${pageStart+1}–${pageStart+pageCount} of ${totalCount}</span>
      <div class="page-controls">
        <button class="page-nav" id="crPrev" ${current===1?'disabled':''}>‹ Prev</button>
        <div class="page-nums">${pageBtns}</div>
        <button class="page-nav" id="crNext" ${current===total?'disabled':''}>Next ›</button>
      </div>
    </div>`;
}

function renderTasks(forExport){
  const tasks = STATE.data.tasks || [];
  const cards = tasks.map((t,i)=>{
    const fields = [];
    if(t['Details']) fields.push(['Details', t['Details']]);
    if(t['Remarks']) fields.push(['Remarks', t['Remarks']]);
    return `
    <div class="task-card${forExport?' open':''}" data-idx="${i}">
      <div class="task-top">
        <div class="task-num">${esc(t['Bil']!==undefined?t['Bil']:i+1)}</div>
        <div class="task-name">${esc(t['Task Name']||'Untitled task')}</div>
        <div class="task-date">${t['Date Executed'] ? fmtDate(t['Date Executed']) : ''}</div>
        <div class="task-chev">›</div>
      </div>
      <div class="task-body">
        ${fields.map(([l,v])=>`<div class="field-label">${l}</div><div class="field-val">${esc(v)}</div>`).join('')}
        ${fields.length===0 ? '<div class="field-val" style="color:var(--text-faint);font-style:italic;">No further details recorded.</div>' : ''}
      </div>
    </div>`;
  }).join('');

  return `
    <div class="page-head">
      <h1>${esc(STATE.data.taskSheetName || 'Additional Tasks')}</h1>
      <span class="hint">${tasks.length} tasks logged</span>
    </div>
    <div class="panel">
      ${cards || '<div style="padding:24px;color:var(--text-faint);">No additional tasks found in the workbook.</div>'}
    </div>
  `;
}

function renderDeployment(){
  const deps = STATE.data.deployment || [];
  const crIndex = {};
  (STATE.data.crs||[]).forEach(c=>{ crIndex[c[crIdColumn()]] = c; });

  const rows = deps.map(d=>{
    const known = crIndex[d['CR']];
    return `
    <tr>
      <td><span class="dep-cr" data-id="${esc(d['CR'])}">${esc(d['CR']||'—')}</span>${known?` <span style="color:var(--text-faint);font-size:11px;">· ${esc(known['Request Title']||'')}</span>`:''}</td>
      <td>${d['Date Deployed'] ? fmtDate(d['Date Deployed']) : '<span class="empty-cell">—</span>'}</td>
      <td>${d['Time Deployed'] ? esc(d['Time Deployed']) : '<span class="empty-cell">—</span>'}</td>
      <td>${d['PIC'] ? esc(d['PIC']) : '<span class="empty-cell">—</span>'}</td>
      <td class="dep-plan">${d['Deployment plan'] ? esc(d['Deployment plan']) : '<span class="empty-cell">Not specified</span>'}</td>
    </tr>`;
  }).join('');

  return `
    <div class="page-head">
      <h1>${esc(STATE.data.depSheetName || 'CR Deployment')}</h1>
      <span class="hint">${deps.length} deployments recorded</span>
    </div>
    <div class="panel" style="overflow-x:auto;">
      <table class="dep-table">
        <thead><tr><th>CR</th><th>Date Deployed</th><th>Time</th><th>PIC</th><th>Deployment Plan</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="5" style="padding:24px;color:var(--text-faint);">No deployment records found in the workbook.</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

/* ================= Modal ================= */
function openCRModal(id){
  const cr = (STATE.data.crs||[]).find(c=>c[crIdColumn()]===id);
  if(!cr) return;
  const st = cr['Status']||'Unknown';
  const ss = statusStyle(st);
  const pr = cr['Priority'];
  const prColor = PRIORITY_COLOR[pr] || '#5b6b93';
  const delayed = (cr['Delay Status']||'').toLowerCase()==='delayed';

  const body = document.getElementById('modalBody');
  body.innerHTML = `
    <div class="modal-close" id="modalCloseBtn">&times;</div>
    <div class="modal-header">
      <div class="modal-id">${esc(cr[crIdColumn()])}</div>
      <div class="modal-title">${esc(cr['Request Title']||'Untitled')}</div>
      <div class="modal-scope">${esc(cr['Skop/Fokus']||'')}</div>
    </div>
    <div class="modal-badges">
      <span class="pill" style="color:${ss.color};background:${ss.bg}"><span class="dot"></span>${esc(st)}</span>
      ${pr ? `<span class="pill" style="color:${prColor};background:${prColor}22"><span class="dot"></span>${esc(pr)} priority</span>` : ''}
      ${delayed ? `<span class="pill" style="color:var(--c-delay);background:rgba(248,113,113,.12)"><span class="dot"></span>Delayed</span>` : ''}
    </div>
    <div class="modal-grid">
      <div><div class="mfield-label">Request Date</div><div class="mfield-val">${fmtDate(cr['Request Date'])}</div></div>
      <div><div class="mfield-label">Start Date</div><div class="mfield-val">${fmtDate(cr['Start Date'])}</div></div>
      <div><div class="mfield-label">Target Completion</div><div class="mfield-val">${fmtDate(cr['Target Completion Date'])}</div></div>
      <div><div class="mfield-label">Actual Completion</div><div class="mfield-val">${fmtDate(cr['Actual Completion Date'])}</div></div>
      <div><div class="mfield-label">Man Days</div><div class="mfield-val">${cr['Man Days']!==null&&cr['Man Days']!==undefined?cr['Man Days']:'—'}</div></div>
      <div><div class="mfield-label">Days Open</div><div class="mfield-val">${cr['Days Open']!==null&&cr['Days Open']!==undefined?cr['Days Open']:'—'}</div></div>
    </div>
    ${cr['Description'] ? `<div class="modal-block"><div class="field-label">Description</div><div class="field-val">${esc(cr['Description'])}</div></div>` : ''}
    ${cr['Remarks'] ? `<div class="modal-block"><div class="field-label">Remarks / Progress Log</div><div class="field-val">${esc(cr['Remarks'])}</div></div>` : ''}
    ${cr['Table affected'] ? `<div class="modal-block"><div class="field-label">Table(s) Affected</div><div class="field-val">${esc(cr['Table affected'])}</div></div>` : ''}
    ${cr['Column affected'] ? `<div class="modal-block"><div class="field-label">Column(s) Affected</div><div class="field-val">${esc(cr['Column affected'])}</div></div>` : ''}
  `;
  document.getElementById('modalCloseBtn').addEventListener('click', closeCRModal);
  document.getElementById('modalBackdrop').classList.add('show');
}
function closeCRModal(){ document.getElementById('modalBackdrop').classList.remove('show'); }

/* ================= Event wiring ================= */
function attachPageEvents(){
  document.querySelectorAll('.cr-row').forEach(el=>{
    el.addEventListener('click', ()=> openCRModal(el.dataset.id));
  });
  document.querySelectorAll('.task-card').forEach(el=>{
    el.querySelector('.task-top').addEventListener('click', ()=> el.classList.toggle('open'));
  });
  document.querySelectorAll('.dep-cr').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.id;
      if((STATE.data.crs||[]).some(c=>c[crIdColumn()]===id)) openCRModal(id);
    });
  });
  const prevBtn = document.getElementById('crPrev');
  const nextBtn = document.getElementById('crNext');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{ STATE.crPage--; renderPage(); });
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ STATE.crPage++; renderPage(); });
  document.querySelectorAll('.page-num').forEach(el=>{
    el.addEventListener('click', ()=>{ STATE.crPage = parseInt(el.dataset.page,10); renderPage(); });
  });
  document.querySelectorAll('.scope-chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      const scope = el.dataset.scope;
      if(!scope){
        STATE.scopeFilters = []; // "All" clears any active selection
      } else {
        const i = STATE.scopeFilters.indexOf(scope);
        if(i === -1) STATE.scopeFilters.push(scope);
        else STATE.scopeFilters.splice(i, 1);
      }
      STATE.crPage = 1;
      renderPage();
    });
  });
}

document.getElementById('nav').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  STATE.page = btn.dataset.page;
  renderPage();
});
document.getElementById('modalBackdrop').addEventListener('click', e=>{
  if(e.target.id === 'modalBackdrop') closeCRModal();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeCRModal(); });

/* ================= Toast ================= */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 3200);
}

/* ================= Excel Upload / Parsing ================= */
document.getElementById('downloadTemplateBtn').addEventListener('click', ()=>{
  try{
    const byteChars = atob(TEMPLATE_XLSX_BASE64);
    const byteNumbers = new Array(byteChars.length);
    for(let i=0;i<byteChars.length;i++) byteNumbers[i] = byteChars.charCodeAt(i);
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'CR_Enhancement_Tasks_Tracking-template.xlsx';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast('Template downloaded — fill it in and upload it back');
  }catch(err){
    console.error(err);
    showToast('Could not prepare the template file');
  }
});

document.getElementById('uploadBtn').addEventListener('click', ()=> document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = evt=>{
    try{
      const wb = XLSX.read(evt.target.result, {type:'array', cellDates:true});
      const parsed = parseWorkbook(wb);
      STATE.data = parsed;
      STATE.crPage = 1;
      STATE.scopeFilters = [];
      STATE.fileName = file.name;
      document.getElementById('fileStamp').textContent = file.name;
      STATE.page = 'overview';
      renderPage();
      showToast('Dashboard updated from ' + file.name);
    }catch(err){
      console.error(err);
      showToast('Could not read that file — check it matches the template.');
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
});

function sheetToObjects(wb, name, headerRowIdx){
  const ws = wb.Sheets[name];
  if(!ws) return [];
  const opts = {defval:null, raw:false, dateNF:'yyyy-mm-dd'};
  if(headerRowIdx) opts.range = headerRowIdx;
  const rows = XLSX.utils.sheet_to_json(ws, opts);
  return rows.filter(r=> Object.values(r).some(v=> v!==null && v!==''));
}

function findSheetName(wb, candidates){
  const names = wb.SheetNames;
  for(const cand of candidates){
    const hit = names.find(n=> n.trim().toLowerCase() === cand.toLowerCase());
    if(hit) return hit;
  }
  // fallback: partial match
  for(const cand of candidates){
    const hit = names.find(n=> n.trim().toLowerCase().includes(cand.toLowerCase()));
    if(hit) return hit;
  }
  return null;
}

function parseWorkbook(wb){
  const crName = findSheetName(wb, ['CR_Tracker','CR Tracker']);
  const taskName = findSheetName(wb, ['Additional Tasks']);
  const depName = findSheetName(wb, ['CR Deployment']);

  const crs = crName ? sheetToObjects(wb, crName, 0) : [];
  const tasks = taskName ? sheetToObjects(wb, taskName, 1) : [];
  const deployment = depName ? sheetToObjects(wb, depName, 1) : [];

  return {
    crs, tasks, deployment,
    crSheetName: crName || 'CR_Tracker',
    taskSheetName: taskName || 'Additional Tasks',
    depSheetName: depName || 'CR Deployment'
  };
}

/* ================= Export: Image (16:9 slide) & PDF (A4, paginated) ================= */
const SLIDE_W = 1920, SLIDE_H = 1080;

function currentThemeColors(){
  const cs = getComputedStyle(document.documentElement);
  return {
    bg: cs.getPropertyValue('--bg').trim() || '#0b1120',
    text: cs.getPropertyValue('--text').trim() || '#e9edf7',
    faint: cs.getPropertyValue('--text-faint').trim() || '#8891a6',
    border: cs.getPropertyValue('--border-soft').trim() || '#243354'
  };
}

function buildExportHTML(){
  if(STATE.page === 'overview') return renderOverview(true);
  if(STATE.page === 'tasks') return renderTasks(true);
  return renderDeployment();
}

async function captureContent(){
  closeCRModal();
  await new Promise(r=>setTimeout(r, 60));

  const live = document.getElementById('pageContent');
  const { bg } = currentThemeColors();

  // Render the full (non-paginated) content off-screen so the export
  // always includes every CR / task / deployment, not just the current
  // on-screen page of the list.
  const exportEl = document.createElement('div');
  exportEl.style.position = 'fixed';
  exportEl.style.top = '0';
  exportEl.style.left = '-99999px';
  exportEl.style.width = live.clientWidth + 'px';
  exportEl.innerHTML = buildExportHTML();
  document.body.appendChild(exportEl);

  let canvas;
  try{
    canvas = await html2canvas(exportEl, {
      backgroundColor: bg,
      scale: 2,
      useCORS: true,
      windowWidth: exportEl.scrollWidth
    });
  } finally {
    document.body.removeChild(exportEl);
  }
  return canvas;
}

function buildSlideCanvas(sourceCanvas){
  // Fit source canvas to slide width, add a title bar, letterbox vertically if short.
  const pad = 60;
  const headerH = 130;
  const scale = (SLIDE_W - pad*2) / sourceCanvas.width;
  const drawW = SLIDE_W - pad*2;
  const drawH = sourceCanvas.height * scale;
  const { bg, text, faint, border } = currentThemeColors();

  const out = document.createElement('canvas');
  out.width = SLIDE_W;
  out.height = Math.max(SLIDE_H, headerH + drawH + pad);
  const ctx = out.getContext('2d');

  // background
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,out.width,out.height);

  // header
  ctx.fillStyle = text;
  ctx.font = '700 42px Inter, sans-serif';
  ctx.fillText('CR & Enhancement Tracker', pad, 62);
  ctx.fillStyle = faint;
  ctx.font = '500 24px IBM Plex Mono, monospace';
  const pageTitles = {overview: STATE.data.crSheetName || 'CR_Tracker', tasks: STATE.data.taskSheetName || 'Additional Tasks', deployment: STATE.data.depSheetName || 'CR Deployment'};
  const dateStr = new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  ctx.fillText(`${pageTitles[STATE.page]}  ·  generated ${dateStr}`, pad, 98);
  ctx.strokeStyle = border;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, headerH-20); ctx.lineTo(out.width-pad, headerH-20); ctx.stroke();

  ctx.drawImage(sourceCanvas, pad, headerH, drawW, drawH);
  return out;
}

/* ---------- A4 print canvas (for PDF export) ---------- */
// A4 aspect ratio (210mm x 297mm) rendered at a fixed pixel resolution for crisp output.
const A4_W_PX = 1240, A4_H_PX = 1754; // ratio matches 210:297 exactly
const A4_MARGIN = 50;
const A4_HEADER_H = 92;

function buildA4Canvas(sourceCanvas){
  const { bg, text, faint, border } = currentThemeColors();
  const contentW = A4_W_PX - A4_MARGIN*2;
  const scale = contentW / sourceCanvas.width;
  const contentH = sourceCanvas.height * scale;
  const contentTop = A4_MARGIN + A4_HEADER_H;

  const out = document.createElement('canvas');
  out.width = A4_W_PX;
  out.height = contentTop + contentH + A4_MARGIN;
  const ctx = out.getContext('2d');

  ctx.fillStyle = bg;
  ctx.fillRect(0,0,out.width,out.height);

  ctx.fillStyle = text;
  ctx.font = '700 26px Inter, sans-serif';
  ctx.fillText('CR & Enhancement Tracker', A4_MARGIN, A4_MARGIN + 26);
  ctx.fillStyle = faint;
  ctx.font = '500 14px IBM Plex Mono, monospace';
  const pageTitles = {overview: STATE.data.crSheetName || 'CR_Tracker', tasks: STATE.data.taskSheetName || 'Additional Tasks', deployment: STATE.data.depSheetName || 'CR Deployment'};
  const dateStr = new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  ctx.fillText(`${pageTitles[STATE.page]}  ·  generated ${dateStr}`, A4_MARGIN, A4_MARGIN + 50);
  ctx.strokeStyle = border;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(A4_MARGIN, A4_MARGIN + A4_HEADER_H - 16); ctx.lineTo(out.width - A4_MARGIN, A4_MARGIN + A4_HEADER_H - 16); ctx.stroke();

  ctx.drawImage(sourceCanvas, A4_MARGIN, contentTop, contentW, contentH);
  return out;
}

function downloadCanvasAsImage(canvas, filename){
  canvas.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }, 'image/png');
}

document.getElementById('exportImgBtn').addEventListener('click', async ()=>{
  showToast('Preparing image…');
  const src = await captureContent();
  const slide = buildSlideCanvas(src);
  downloadCanvasAsImage(slide, `CR-Dashboard-${STATE.page}.png`);
  showToast('Image downloaded');
});

document.getElementById('exportPdfBtn').addEventListener('click', async ()=>{
  showToast('Preparing A4 PDF…');
  const src = await captureContent();
  const doc = buildA4Canvas(src);
  const { bg, faint } = currentThemeColors();

  const { jsPDF } = window.jspdf;
  const totalPages = Math.max(1, Math.ceil(doc.height / A4_H_PX));

  const pdf = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });

  for(let p=0; p<totalPages; p++){
    const sy = p * A4_H_PX;
    const sh = Math.min(A4_H_PX, doc.height - sy);
    const pageCanvas = document.createElement('canvas');
    pageCanvas.width = A4_W_PX;
    pageCanvas.height = A4_H_PX;
    const pctx = pageCanvas.getContext('2d');
    pctx.fillStyle = bg;
    pctx.fillRect(0,0,A4_W_PX,A4_H_PX);
    pctx.drawImage(doc, 0, sy, A4_W_PX, sh, 0, 0, A4_W_PX, sh);

    if(totalPages > 1){
      pctx.fillStyle = faint;
      pctx.font = '500 13px IBM Plex Mono, monospace';
      pctx.fillText(`Page ${p+1} of ${totalPages}`, A4_W_PX - A4_MARGIN - 90, A4_H_PX - 22);
    }

    const imgData = pageCanvas.toDataURL('image/png');
    if(p>0) pdf.addPage('a4', 'portrait');
    pdf.addImage(imgData, 'PNG', 0, 0, 210, 297);
  }
  pdf.save(`CR-Dashboard-${STATE.page}.pdf`);
  showToast(totalPages > 1 ? `PDF downloaded (${totalPages} A4 pages)` : 'PDF downloaded');
});

/* ================= Theme toggle ================= */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', STATE.theme);
  document.getElementById('themeIconMoon').style.display = STATE.theme === 'dark' ? 'block' : 'none';
  document.getElementById('themeIconSun').style.display = STATE.theme === 'light' ? 'block' : 'none';
}
document.getElementById('themeToggleBtn').addEventListener('click', ()=>{
  STATE.theme = STATE.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
});

/* ================= Init ================= */
applyTheme();
renderPage();
</script>
